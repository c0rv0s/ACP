[package]
name = "agc_credit_control"
version = "0.1.0"
description = "Experiment 002 AGC credit control plane for policy-constrained USDC credit lines"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "agc_credit_control"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.0.1", features = ["init-if-needed"] }
anchor-spl = "1.0.1"
